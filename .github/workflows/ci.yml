name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (tsc + lint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
          cache-dependency-path: app/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type-check
        run: pnpm tsc --noEmit

      - name: ESLint
        run: pnpm lint

      - name: Vitest
        run: pnpm test

      - name: Next.js production build
        run: pnpm build

  backend:
    name: Backend (ruff + pytest with coverage gate)
    runs-on: ubuntu-latest
    if: hashFiles('app/backend/pyproject.toml') != ''
    defaults:
      run:
        working-directory: app/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest with coverage
        run: pytest --cov=apex --cov-fail-under=70 -q
