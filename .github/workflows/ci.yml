name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# concurrency block dropped entirely. cancel-in-progress: false still showed
# middle queued runs as "cancelled" when a newer push superseded them in the
# queue (only the running + the newest-queued ever execute). For deadline-week
# judge-perception, every commit deserves its own visible run. No concurrency
# group = every push runs independently; accept the runner-minute cost.

jobs:
  frontend:
    name: Frontend (tsc + lint + vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: app/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type-check
        run: pnpm tsc --noEmit

      - name: ESLint
        run: pnpm lint

      - name: Vitest
        run: pnpm test

      - name: Next.js production build
        run: pnpm build

  # Wave-62: the backend is complete (Stephen took ownership from Vinh), so the
  # 192 backend tests now run in CI instead of only locally. This enforces the
  # byte-equality serializer contract + physics V1 + server + contracts +
  # instruct + guardian + pipelines on every push. The torch/cvxpy/cvxpylayers
  # tests importorskip; llama-cpp-python / granite-tsfm / fastf1 / transformers /
  # datasets / accelerate are excluded from the install (those tests skip
  # cleanly) so CI stays fast + wheel-only with no from-source builds.
  backend:
    name: Backend (pytest, GPU-free)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install GPU-free deps
        run: |
          python -m pip install --upgrade pip
          grep -vE '^(cvxpy|cvxpylayers|diffcp|llama_cpp_python|granite-tsfm|fastf1|transformers|datasets|accelerate)([=<>! ]|$)' requirements.txt > /tmp/req-ci.txt
          pip install -r /tmp/req-ci.txt
          pip install fastapi "uvicorn[standard]" structlog
      - name: Run backend tests (GPU/heavy-dep tests importorskip)
        run: python -m pytest tests/ -q

  # Wave-43 C2.4 + C2.5 Playwright fidelity job. Separate from the frontend
  # vitest job so a Playwright failure surfaces independently from vitest
  # failure. Wave-43 cascade-#15 F2-round-2 close-out per Stephen explicit
  # galaxy-ambition mandate: Playwright is BLOCKING (continue-on-error
  # removed). Submission-week quality: a Playwright failure means a
  # production-fidelity regression on /judges OR /analyze; that must red
  # the deploy. If Playwright install in CI flakes intermittently, fix
  # the install path; do not mask the signal.
  playwright:
    name: Frontend Playwright fidelity (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: app/frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Next.js production build
        run: pnpm build
      - name: Playwright fidelity
        run: pnpm exec playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/frontend/playwright-report
          retention-days: 7
