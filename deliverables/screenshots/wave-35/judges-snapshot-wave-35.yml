    - region "Q&A defense pack." [ref=e709]:
      - generic [ref=e710]:
        - heading "Q&A defense pack." [level=2] [ref=e711]
        - paragraph [ref=e712]: The five hostile questions we rehearsed three times each. Cards are public; the internal canonical source lives in the team’s private memory.
        - list [ref=e713]:
          - listitem [ref=e714]:
            - article [ref=e715]:
              - generic [ref=e716]:
                - generic [ref=e717]: Card 01
                - heading "Deep Dynamics differentiator" [level=3] [ref=e718]
              - paragraph [ref=e719]: Q. Deep Dynamics already trains a physics-informed neural network on race telemetry. Why is APEX different?
              - paragraph [ref=e720]: "A. Deep Dynamics retrains a bespoke PINN. APEX takes a frozen pretrained foundation model (Granite TimeSeries TTM, NeurIPS 2024) and wraps its outputs in a differentiable CvxpyLayer QP at inference. We do not retrain. The physics enforcement is post-hoc projection, not training-time regularisation. That makes our pattern transferable: any future TSFM gets the same physics envelope without re-training."
          - listitem [ref=e721]:
            - article [ref=e722]:
              - generic [ref=e723]:
                - generic [ref=e724]: Card 02
                - heading "Kinetic Hallucination" [level=3] [ref=e725]
              - paragraph [ref=e726]: Q. TTM was pretrained on weather + retail. Why would it forecast valid motorsport telemetry at all?
              - paragraph [ref=e727]: A. It does not, by itself. Without constraints TTM can forecast 4G lateral with zero steering or speed increasing at zero throttle. That is the Kinetic Hallucination problem. The differentiable physics-projection layer (friction ellipse + bicycle model + forward-Euler kinematic step) projects every forecast step onto the feasible manifold. Granite Guardian audits the structured text log of every projection correction. Convergence 14 is the serializer unit-test suite that verifies the physics-violation log is faithful.
          - listitem [ref=e728]:
            - article [ref=e729]:
              - generic [ref=e730]:
                - generic [ref=e731]: Card 03
                - heading "Serialization integrity" [level=3] [ref=e732]
              - paragraph [ref=e733]: Q. What stops the projection layer from silently corrupting the forecast it claims to correct?
              - paragraph [ref=e734]: "A. Convergence 14: a Python unit-test suite that fires every kinematic violation type (friction-ellipse breach, bicycle-model breach, jerk-bound breach, COA-simultaneity breach) and verifies the serialized text log Guardian receives matches the projection layer's internal record. Day 5-6 ship target. Without this suite, the projection layer is a black box. With it, every claim is testable."
          - listitem [ref=e735]:
            - article [ref=e736]:
              - generic [ref=e737]:
                - generic [ref=e738]: Card 04
                - heading "COA-parameterized simultaneity" [level=3] [ref=e739]
              - paragraph [ref=e740]: Q. Why not just use Track Titan or Trophi.ai if you already have telemetry-aware AI race engineers?
              - paragraph [ref=e741]: A. Existing tools assume able-bodied physics. They encode throttle * brake = 0 because no able-bodied driver presses both at once. Adaptive drivers do, when their FIA Certificate of Adaptations (governed by Appendix L of the International Sporting Code) permits simultaneity through their hand-control or paddle-shift system. APEX reads the COA at tensor level. When the COA permits simultaneity, the projection layer permits it. When the COA does not, the constraint enforces. Same coaching pipeline says different things for different drivers based on what their COA says they are allowed to do.
          - listitem [ref=e742]:
            - article [ref=e743]:
              - generic [ref=e744]:
                - generic [ref=e745]: Card 05
                - heading "Latency budget" [level=3] [ref=e746]
              - paragraph [ref=e747]: Q. 60 seconds on RTX 4060. Will it run on the judge's machine?
              - paragraph [ref=e748]: "A. The 60-second budget is the post-race coaching loop on RTX 4060: TTM forecast + projection + Guardian audit + Instruct narration. Granite-Docling + Granite Vision (the document parsers) run once at onboarding and cache to disk. The judge runs the Hugging Face Space deploy (Day 9) or the Colab notebook (Day 9) for a zero-install demo. Both keep the same 60-second loop. The Colab notebook removes the local GPU requirement entirely."
